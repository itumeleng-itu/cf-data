[project]
name = "coursefind-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "api",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]
extract = [
    "boto3>=1.43.62",
    "pdfplumber>=0.11.10",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    # Reads R2 credentials from .env for extract/storage.py's two callers,
    # scripts/archive_source.py and tests/test_storage_live.py. It was
    # swept out with psycopg when the database went, having sat next to it
    # in the top-level dependencies -- but it was never database code, and
    # without it tests/test_storage_live.py fails at IMPORT, which aborts
    # collection for the whole suite rather than skipping one R2 test.
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
markers = [
    "docker: builds and runs the real Docker image -- skip with -m 'not docker' when Docker is unavailable",
    "r2: touches real Cloudflare R2 -- skip with -m 'not r2' when R2 credentials are unset",
    "slow: exercises a real, non-synthetic fixture (e.g. a real prospectus PDF) -- may be slow or absent on a fresh clone",
]
