name: Build data image

# Tag format: data-v<YEAR>.<REVISION>, e.g. data-v2027.1, data-v2027.2 for a
# correction. The YEAR.REVISION portion (everything after "data-v") becomes
# both the Docker image tag and the DATA_VERSION baked into it.
on:
  push:
    tags:
      - "data-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coursefind-api

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive data version and academic years from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          data_version="${tag#data-v}"
          primary_year="${data_version%%.*}"
          next_year=$((primary_year + 1))
          echo "data_version=${data_version}" >> "$GITHUB_OUTPUT"
          # Two academic years are live simultaneously (see architecture
          # decision #6) -- every build exports both, regardless of which
          # one this particular revision is correcting.
          echo "years=${primary_year},${next_year}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --locked --all-packages --group extract

      # --- Everything below this line must pass before an image is even
      # built. A bad extraction, a failed validation, or a broken test must
      # never produce a pushed, deployable image. ---

      - name: Export data from Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          uv run python scripts/export_data.py
          --years "${{ steps.version.outputs.years }}"
          --out api/src/app/data/programmes.json
          --verified-only

      - name: Validate exported data
        run: uv run python scripts/validate_data.py api/src/app/data/programmes.json

      - name: Run full test suite (including golden tests, excluding docker smoke test)
        run: uv run pytest tests api/tests -v -m "not docker"

      # --- Only reachable if every step above succeeded. ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            DATA_VERSION=${{ steps.version.outputs.data_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.data_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
