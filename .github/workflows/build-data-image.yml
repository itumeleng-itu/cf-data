name: Build data image

# Tag format: data-v<YEAR>.<REVISION>, e.g. data-v2027.1, data-v2027.2 for a
# correction. The YEAR.REVISION portion (everything after "data-v") becomes
# both the Docker image tag and the DATA_VERSION baked into it.
#
# A tag is the normal path, because the tag is the record of what was
# shipped. workflow_dispatch is the same build without one: the Actions
# tab is a top-level tab, where Releases is a small heading in the Code
# page's sidebar that is easy to miss, and some environments cannot push
# a tag ref at all. It builds from whatever ref you pick, so a dispatched
# build is not self-documenting the way a tagged one is -- tag when you
# can, dispatch when you cannot.
on:
  push:
    tags:
      - "data-v*"
  workflow_dispatch:
    inputs:
      data_version:
        description: "Version to build, WITHOUT the data-v prefix (e.g. 2027.1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coursefind-api

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive data version and academic years
        id: version
        run: |
          # On a tag push GITHUB_REF_NAME is the tag; on a dispatch it is
          # the branch, so the version comes from the input instead.
          # Stripping the prefix either way lets someone type either
          # "2027.1" or "data-v2027.1" into the Actions form.
          raw="${{ inputs.data_version || github.ref_name }}"
          data_version="${raw#data-v}"
          if ! echo "$data_version" | grep -Eq '^[0-9]{4}\.[0-9]+$'; then
            echo "::error::Expected <YEAR>.<REVISION>, e.g. 2027.1 — got '${raw}'"
            exit 1
          fi
          primary_year="${data_version%%.*}"
          next_year=$((primary_year + 1))
          echo "data_version=${data_version}" >> "$GITHUB_OUTPUT"
          # Two academic years are live simultaneously (see architecture
          # decision #6) -- every build exports both, regardless of which
          # one this particular revision is correcting.
          echo "years=${primary_year},${next_year}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --locked --all-packages --group extract

      # --- Everything below this line must pass before an image is even
      # built. A bad extraction, a failed validation, or a broken test must
      # never produce a pushed, deployable image. ---

      # No database in the build path. The records live in seeds/, where a
      # pull-request diff is the review and git is the history; Postgres
      # remains only as the editorial layer for a re-ingest (see
      # scripts/export_from_seeds.py for why both exporters exist). Nothing
      # downstream can tell the two apart -- they emit the same shape.
      #
      # --verified-only is kept: the gate moved from a database column to a
      # reviewed file, it did not disappear. A seed record that no one has
      # signed off is confidence='extracted' and does not ship.
      - name: Export data from seeds
        run: >
          uv run python scripts/export_from_seeds.py
          --years "${{ steps.version.outputs.years }}"
          --out api/src/app/data/programmes.json
          --verified-only

      - name: Validate exported data
        run: uv run python scripts/validate_data.py api/src/app/data/programmes.json

      - name: Run full test suite (including golden tests, excluding docker smoke test)
        run: uv run pytest tests api/tests -v -m "not docker"

      # --- Only reachable if every step above succeeded. ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            DATA_VERSION=${{ steps.version.outputs.data_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.data_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
